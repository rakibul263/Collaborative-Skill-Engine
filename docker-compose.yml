name: collaborative-skill-engine

services:
  server:
    build:
      context: ./cse-server
      dockerfile: Dockerfile
    container_name: cse-server
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    # Optional so a fresh clone still boots; create it from .env.example first:
    #   cp cse-server/.env.example cse-server/.env
    env_file:
      - path: ./cse-server/.env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./cse-server/storage:/app/storage
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - cse-network

  client:
    build:
      context: ./cse-client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    container_name: cse-client
    restart: unless-stopped
    init: true
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cse-network

networks:
  cse-network:
    driver: bridge
